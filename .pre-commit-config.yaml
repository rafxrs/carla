# Uses the project's own black/ruff (activate the venv): `pre-commit install` once.
# pre-commit passes file names explicitly, which bypasses pyproject's extend-exclude.
exclude: ^src/carla/agents/catanatron/vendor/
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
