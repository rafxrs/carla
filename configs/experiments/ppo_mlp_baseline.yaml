# Single-environment, on-policy MLP PPO against three fixed random bots.
extends: ../base.yaml
name: ppo_mlp_baseline
ppo:
  total_env_steps: 100000
  rollout_steps: 256
  minibatch_size: 256
opponents:
  pool:
    - kind: random
runtime:
  num_workers: 1
  envs_per_worker: 1
  checkpoint_every: 25
  log_every: 5
