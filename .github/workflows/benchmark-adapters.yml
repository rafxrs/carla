name: Optional benchmark adapters
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/carla/agents/**'
      - 'src/carla/planning/**'
      - 'src/carla/engine/**'
      - 'adapters/**'
      - 'tests/agents/**'
      - 'scripts/setup_benchmarks.py'
      - 'scripts/run_jsettlers_benchmark.py'
      - 'scripts/check_jsettlers_policy.py'
      - 'scripts/check_catanatron_policy.py'
      - 'scripts/run_catanatron_benchmark.py'
      - 'src/carla/rl/**'
      - 'src/carla/envs/**'
      - '.github/workflows/benchmark-adapters.yml'
jobs:
  adapters:
    env:
      PYTHONHASHSEED: '0'  # Catanatron decisions depend on string hashing.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: uv sync --extra dev --extra benchmarks --extra cpu
      - run: uv run --extra dev --extra benchmarks --extra cpu python scripts/setup_benchmarks.py --skip-catanatron
      - run: uv run --extra dev --extra benchmarks --extra cpu python -c "import json,os,pathlib; m=json.loads(pathlib.Path('outputs/benchmark-deps/manifest.json').read_text()); pathlib.Path(os.environ['GITHUB_ENV']).open('a').write('JSETTLERS_JAR='+m['jar']+'\nCARLA_JSETTLERS_CLASSES='+m['classes']+'\n')"
      - run: uv run --extra dev --extra benchmarks --extra cpu pytest tests/agents/test_benchmark_contract.py tests/agents/test_benchmark_extensions.py tests/agents/test_catanatron_host.py tests/agents/test_ppo_external_referees.py tests/agents/test_jsettlers_bridge.py tests/agents/test_jsettlers_native.py tests/agents/test_jsettlers_native_osp.py tests/agents/test_jsettlers_referee_cleanup.py -q
